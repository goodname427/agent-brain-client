name: Client release
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact merged Client source SHA (40 characters)
        required: true
        type: string
      version:
        description: auto selects the next shared platform patch; otherwise major.minor.patch
        default: auto
        type: string
      release_notes:
        description: Public Markdown changelog (new features, fixes, impact and reload instructions)
        required: true
        type: string
      targets:
        description: Normally release both; select one group only to complete a partial delivery
        default: all
        type: choice
        options: [all, macos, windows]
      installation_mode:
        description: Reinstall audits a new layout for all four platforms; existing profile pins stay unchanged
        default: upgrade
        type: choice
        options: [upgrade, reinstall]
      publish:
        description: Publish immutable releases and advance selected existing platform channels
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    outputs:
      bundle: client-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .local/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare and validate without publication credentials
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGETS: ${{ inputs.targets }}
          RELEASE_INSTALLATION_MODE: ${{ inputs.installation_mode }}
        run: |
          mkdir -p .local
          printf '%s\n' "$RELEASE_NOTES" > .local/release-notes-input.md
          python -B .local/release-tools/dev/release/client.py prepare-artifacts --release-notes-file .local/release-notes-input.md --source-root "$GITHUB_WORKSPACE" --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" --targets "$RELEASE_TARGETS" --installation-mode "$RELEASE_INSTALLATION_MODE" --output .local/release
      - name: Preserve bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Job summary
        if: always()
        run: |
          if [ -f .local/release/progress.json ]; then
            cat .local/release/progress.json >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .local/release-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.prepare.outputs.bundle }}
          path: .local/release
      - name: Publish, promote and read back exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .local/release-tools/dev/release/client.py publish --source-root "$GITHUB_WORKSPACE" --output .local/release --allow-publish --wait-for-ci 1800
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/
          include-hidden-files: true
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          if [ -f .local/release/progress.json ]; then
            cat .local/release/progress.json >> "$GITHUB_STEP_SUMMARY"
          fi
