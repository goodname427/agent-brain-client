name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolated tests and public source scan
        shell: bash
        run: |
          TEST_ROOT=$(mktemp -d)
          mkdir -p "$TEST_ROOT/home" "$TEST_ROOT/codex"
          export HOME="$TEST_ROOT/home" CODEX_HOME="$TEST_ROOT/codex"
          export PYTHONPATH=scripts:adapters/codex:tools:tests
          python -B -m unittest discover -s tests
          python -B tools/build_client.py --scan
          python -B tools/check_source.py
          sh -n tools/install-mac.sh
          git diff --check
      - name: Lint and type check new installer code
        shell: bash
        run: |
          python -m pip install ruff==0.14.0 mypy==1.18.2
          ruff check --no-cache --select E4,E7,E9,F --ignore E402 tools/mac_first_install.py tools/client_lifecycle.py tools/prepare_install_runtime.py tools/check_source.py tests/test_mac_first_install.py tests/test_client_uninstall.py tests/test_install_contracts.py
          ruff check --no-cache --select F821,F822,F823,F841 adapters/codex scripts
          ruff check --no-cache --select E4,E7,E9,F --ignore E402 tests/test_content_local_durable.py
          mypy --check-untyped-defs --follow-imports skip --ignore-missing-imports tools/mac_first_install.py tools/client_lifecycle.py tools/prepare_install_runtime.py tools/check_source.py
          mypy --check-untyped-defs --follow-imports skip --ignore-missing-imports adapters/codex/content_cache.py
      - name: Keychain helper self-check only
        shell: bash
        run: |
          TEST_ROOT=$(mktemp -d)
          mkdir -p "$TEST_ROOT/home" "$TEST_ROOT/codex"
          HOME="$TEST_ROOT/home" CODEX_HOME="$TEST_ROOT/codex" python -B tools/build_credential_helper.py --output "$TEST_ROOT/credential-helper"
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Paths and injected pairing contract only
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path "$testRoot/home", "$testRoot/codex" | Out-Null
          $env:HOME = "$testRoot/home"
          $env:USERPROFILE = "$testRoot/home"
          $env:CODEX_HOME = "$testRoot/codex"
          $env:PYTHONPATH = 'scripts;adapters/codex;tools;tests'
          python -B -m unittest test_install_contracts.Contracts test_install_contracts.PlatformMainContracts
