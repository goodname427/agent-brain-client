name: Client checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: client-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
      mac: ${{ steps.scope.outputs.mac }}
      windows: ${{ steps.scope.outputs.windows }}
      full: ${{ steps.scope.outputs.full }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: scope
        run: python -B dev/checks/scope.py
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Shared documentation checks
        run: python -B dev/checks/client.py documentation --ci --output "${{ runner.temp }}/documentation"
  source-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned lint and type tools
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install ruff==0.14.0 mypy==1.18.2
      - name: Shared source checks including every host adapter
        if: github.event_name == 'workflow_dispatch'
        run: python -B dev/checks/client.py source --ci --output "${{ runner.temp }}/source"
      - name: Fast blockers and directed regressions
        if: github.event_name != 'workflow_dispatch'
        run: python -B dev/checks/quick.py
  isolated-client:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Shared isolated tests and full-run Swift checks
        env:
          CI_TESTS: ${{ needs.changes.outputs.tests }}
        run: python -B dev/checks/client.py macos --ci --output "${{ runner.temp }}/macos"
  windows-contracts:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Shared native Windows contracts and every host adapter
        run: python -B dev/checks/client.py windows --ci --output "${{ runner.temp }}/windows"
  required:
    name: Client checks required
    if: always()
    needs: [changes, documentation, source-checks, isolated-client, windows-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify every selected job actually succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -B dev/checks/scope.py verify
  full-validation:
    name: Client full validation
    needs: [changes, required]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo 'All Client platforms and source checks actually succeeded for this checkout.'
