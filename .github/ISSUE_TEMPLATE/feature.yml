name: Feature · 功能需求
description: 提出新功能或现有功能的改进。
type: Feature
labels:
  - '状态: 待开发'
body:
  - type: markdown
    attributes:
      value: |
        在 Issue 侧栏按实际改动选择至少一个现有模块标签，填写验收方和验收方式。无编辑权限时由维护者补齐。
        适用字段见[建单规范](https://github.com/goodname427/agent-brain-client/blob/main/docs/development/engineering-practices.md#建单与回读)。
  - type: textarea
    id: scope
    attributes:
      label: 需求与工作范围
      description: 写明用户场景、期望行为和本次交付范围。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可执行的验证步骤和可观察的通过条件。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 日志、附件或补充背景
      description: 按需附上相关日志、截图或参考链接，可留空。
